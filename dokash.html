<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sổ Quỹ</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Quỹ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;font-family:'DM Sans',sans-serif}
body{display:flex;flex-direction:column}

.zone{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-decoration:none;cursor:pointer;user-select:none;
  transition:filter .12s;position:relative;overflow:hidden;
}
.zone:active{filter:brightness(.93)}

/* TODAY — 66% */
.zone-today{
  flex:0 0 66.667%;
  background:#EC407A;
  color:#fff;
}
.zone-today::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 60% 40%, rgba(255,255,255,.15) 0%, transparent 70%);
  pointer-events:none;
}

/* YESTERDAY — 33% */
.zone-yesterday{
  flex:0 0 33.333%;
  background:#37474F;
  color:rgba(255,255,255,.75);
  border-top:1px solid rgba(255,255,255,.08);
}

.zone-tag{
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  opacity:.65;margin-bottom:10px;
}
.zone-date{
  font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1;
  margin-bottom:6px;
}
.zone-today .zone-date{font-size:38px}
.zone-dow{
  font-size:13px;opacity:.55;font-weight:400;letter-spacing:.02em;
}

/* arrow hint */
.zone-arrow{
  position:absolute;bottom:18px;right:22px;
  font-size:18px;opacity:.3;
}
.zone-today .zone-arrow{opacity:.4}
</style>
</head>
<body>

<a class="zone zone-today" id="zoneToday" href="kashbook.html">
  <div class="zone-tag">Hôm nay</div>
  <div class="zone-date" id="todayDate"></div>
  <div class="zone-dow" id="todayDow"></div>
  <span class="zone-arrow">→</span>
</a>

<a class="zone zone-yesterday" id="zoneYest" href="#">
  <div class="zone-tag">Hôm qua</div>
  <div class="zone-date" id="yestDate"></div>
  <div class="zone-dow" id="yestDow"></div>
  <span class="zone-arrow">→</span>
</a>

<script>
const DOW = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];

function toKey(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function fmtDate(d) {
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}

const today = new Date();
const yest  = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);

document.getElementById('todayDate').textContent = fmtDate(today);
document.getElementById('todayDow').textContent  = DOW[today.getDay()];
document.getElementById('yestDate').textContent  = fmtDate(yest);
document.getElementById('yestDow').textContent   = DOW[yest.getDay()];
document.getElementById('zoneYest').href         = 'kashbook.html?date=' + toKey(yest);
</script>
</body>
</html>
